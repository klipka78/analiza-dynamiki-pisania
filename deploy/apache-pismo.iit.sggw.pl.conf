# /etc/apache2/sites-available/pismo.iit.sggw.pl.conf
# HTTPS kończy się na reverse proxy przed tym hostem (port 80).

<VirtualHost *:80>
    ServerName pismo.iit.sggw.pl

    # Zbudowany frontend (po: cd frontend && npm ci && npm run build)
    DocumentRoot /home/a304500/public_html/pismo/frontend/dist

    ErrorLog ${APACHE_LOG_DIR}/pismo.iit.sggw.pl_error.log
    CustomLog ${APACHE_LOG_DIR}/pismo.iit.sggw.pl_access.log combined

    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /home/a304500/public_html/pismo/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # FastAPI (uvicorn na 127.0.0.1:8000)
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # Nie proxuj reszty — serwuj pliki statyczne z DocumentRoot
</VirtualHost>
