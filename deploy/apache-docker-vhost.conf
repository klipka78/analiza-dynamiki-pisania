# Apache przed kontenerem Docker (HOST_PORT=8080)
# Plik: /etc/apache2/sites-available/pismo.iit.sggw.pl.conf
#
# Wymaga:
#   sudo a2enmod proxy proxy_http headers remoteip
#
# HTTPS kończy się na zewnętrznym reverse proxy → ten vhost na :80

<VirtualHost *:80>
    ServerName pismo.iit.sggw.pl

    ErrorLog ${APACHE_LOG_DIR}/pismo.iit.sggw.pl_error.log
    CustomLog ${APACHE_LOG_DIR}/pismo.iit.sggw.pl_access.log combined

    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    # Cały ruch → kontener web (nginx + /api do FastAPI)
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
