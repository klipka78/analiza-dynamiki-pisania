services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/keystroke.db}
      DOMAIN: ${DOMAIN:-pismo.iit.sggw.pl}
      PUBLIC_URL: ${PUBLIC_URL:-https://pismo.iit.sggw.pl}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - keystroke_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Apache/reverse-proxy na hoście → ten port (domyślnie tylko localhost)
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:80"

volumes:
  keystroke_data:
